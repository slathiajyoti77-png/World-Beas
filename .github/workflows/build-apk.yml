name: Build World Beats APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip WORLD_BEATS_project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project/world_beats_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-beats-apk
          path: project/world_beats_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
